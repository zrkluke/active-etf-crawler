name: Daily Active ETF Holdings

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force run even if market_sent.txt already matches expected date"
        type: boolean
        default: false
  schedule:
    # Primary triggers are driven by external cron (cron-job.org) via workflow_dispatch
    # at 21:05, 21:35, 22:05, 22:35, 23:05, 23:35 Asia/Taipei (Mon-Fri).
    # Keep two lightweight overnight fallback windows (00:37 and 02:37 Asia/Taipei,
    # Tue-Sat morning for Mon-Fri trading days) in case external cron fails or data is late.
    - cron: "37 16,18 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-active-etf-crawler
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check out data (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 1

      - name: Check if already sent
        id: marker
        shell: bash
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Force flag enabled; skipping marker check."
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TPE_HOUR=$((10#$(TZ="Asia/Taipei" date "+%H")))
          if [ "$TPE_HOUR" -ge 15 ]; then
            EXPECTED_DATE=$(TZ="Asia/Taipei" date "+%Y/%m/%d")
          else
            EXPECTED_DATE=$(TZ="Asia/Taipei" date -d "24 hours ago" "+%Y/%m/%d")
          fi

          MARKER_FILE="data/market_sent.txt"
          if [ -f "$MARKER_FILE" ]; then
            LAST_SENT=$(tr -d '\r\n ' < "$MARKER_FILE")
            echo "Event: ${{ github.event_name }} | Last sent: $LAST_SENT | Expected: $EXPECTED_DATE"
            if [ "$LAST_SENT" = "$EXPECTED_DATE" ]; then
              echo "Already sent for $EXPECTED_DATE. Skipping crawler execution."
              echo "already_sent=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "already_sent=false" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        if: steps.marker.outputs.already_sent != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Fetch market data and send notification
        if: steps.marker.outputs.already_sent != 'true'
        run: uv run main.py --market-only --notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Upload CSV artifacts
        if: steps.marker.outputs.already_sent != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: active-etf-holdings-data
          path: data/

      - name: Commit updated data
        if: steps.marker.outputs.already_sent != 'true'
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): 更新每日大盤與商品數據標記" -m "更新大盤與商品數據發送紀錄。"
            git push origin HEAD:data
          fi
